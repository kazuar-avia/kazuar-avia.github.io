name: Update pies balance

on:
  workflow_call:

permissions:
  contents: write

# Runs only when update-guaranteed-bonuses.yml confirms that
# COMPANY/guaranteed-bonuses.json actually changed.
concurrency:
  group: update-pies-ledger
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update pies ledger
        run: node scripts/update-pies-ledger.js
      - name: Publish pies ledger
        run: |
          if git diff --quiet -- COMPANY/pies-ledger.json; then
            echo "No pies balance changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMPANY/pies-ledger.json
          git commit -m "Update pies balance"
          git pull --rebase origin main
          git push
