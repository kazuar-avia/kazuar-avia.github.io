name: Update pies balance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "COMPANY/guaranteed-bonuses.json"
      - "COMPANY/pies-ledger.json"

permissions:
  contents: write
  actions: write

# This workflow is the only automatic writer of the currency ledger.
concurrency:
  group: update-pies-ledger
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update pies ledger
        run: node scripts/update-pies-ledger.js
      - name: Publish pies ledger
        id: publish
        run: |
          if git diff --quiet -- COMPANY/pies-ledger.json; then
            echo "No pies balance changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMPANY/pies-ledger.json
          git commit -m "Update pies balance"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Start Railway cleanup after new commit
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cancel-old-railway.yml --ref main
