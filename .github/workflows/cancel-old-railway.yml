name: Cancel old Railway deployments

on:
  push:
    branches:
      - main

concurrency:
  group: cancel-old-railway
  cancel-in-progress: true

jobs:
  cancel-old:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest

    steps:
      - name: Cancel old Railway deployments
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          echo "Current GitHub commit: $CURRENT_SHA"

          railway deployment list --json > deployments.json

          echo "Deployments:"
          cat deployments.json

          jq -c '.[] | select(.status == "BUILDING" or .status == "QUEUED")' deployments.json |
          while read -r deployment; do

            ID=$(echo "$deployment" | jq -r '.id')
            STATUS=$(echo "$deployment" | jq -r '.status')
            COMMIT=$(echo "$deployment" | jq -r '.meta.commitHash // empty')

            echo "Found: $ID | $STATUS | $COMMIT"

            if [ -z "$COMMIT" ]; then
              echo "SKIP: no commit hash"
              continue
            fi

            if [ "$COMMIT" = "$CURRENT_SHA" ]; then
              echo "KEEP: $ID"
              continue
            fi

            echo "CANCEL: $ID"

            railway api \
              --variables "{\"id\":\"$ID\"}" \
              'mutation($id: String!) { deploymentCancel(id: $id) }'

          done
