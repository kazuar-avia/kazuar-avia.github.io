name: Cancel old Railway deployments

on:
  push:
    branches:
      - main

concurrency:
  group: cancel-old-railway
  cancel-in-progress: true

jobs:
  cancel-old:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 3

    steps:
      - name: Install tools
        run: apk add --no-cache bash jq

      - name: Cancel old Railway deployments
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CURRENT_SHA: ${{ github.sha }}
          SERVICE_ID: efe286ee-8bf7-4113-8b79-4676bb804e0f

        run: |
          set -Eeuo pipefail

          echo "=================================================="
          echo "🚂 Railway old deployment cleaner"
          echo "=================================================="
          echo "Current GitHub SHA: $CURRENT_SHA"
          echo "Service: $SERVICE_ID"

          declare -A CANCEL_REQUESTED=()

          for ATTEMPT in $(seq 1 12); do
            echo
            echo "=================================================="
            echo "🔎 Перевірка $ATTEMPT/12"
            echo "=================================================="

            railway deployment list \
              --service "$SERVICE_ID" \
              --limit 50 \
              --json > deployments.json

            if ! jq -e 'type == "array"' deployments.json >/dev/null; then
              echo "❌ Railway повернув неочікувану відповідь:"
              cat deployments.json
              exit 1
            fi

            echo "Активні Railway deployments:"
            jq -r '
              .[]
              | select(
                  .status == "INITIALIZING"
                  or .status == "WAITING"
                  or .status == "QUEUED"
                  or .status == "BUILDING"
                  or .status == "DEPLOYING"
                )
              | "  \(.status) | \(.id) | \(.meta.commitHash // "NO_COMMIT")"
            ' deployments.json

            CURRENT_DEPLOYMENT_ID="$(
              jq -r --arg sha "$CURRENT_SHA" '
                first(
                  .[]
                  | select((.meta.commitHash // "") == $sha)
                  | .id
                ) // empty
              ' deployments.json
            )"

            if [ -z "$CURRENT_DEPLOYMENT_ID" ]; then
              echo
              echo "⏳ Railway ще не створив deployment для поточного commit."
              echo "   Поки нічого не скасовую."
            else
              echo
              echo "✅ Поточний deployment знайдено: $CURRENT_DEPLOYMENT_ID"

              while IFS=$'\t' read -r ID STATUS COMMIT; do
                [ -z "$ID" ] && continue

                if [ "$COMMIT" = "$CURRENT_SHA" ]; then
                  echo "✅ KEEP   $STATUS | $ID | $COMMIT"
                  continue
                fi

                if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
                  echo "⚠️ SKIP   $STATUS | $ID | немає commitHash"
                  continue
                fi

                if [ -n "${CANCEL_REQUESTED[$ID]:-}" ]; then
                  echo "⏳ WAIT   $STATUS | $ID | скасування вже відправлено"
                  continue
                fi

                echo "❌ CANCEL $STATUS | $ID | $COMMIT"

                railway api \
                  'mutation($id: String!) { deploymentCancel(id: $id) }' \
                  --raw-var id="$ID" \
                  --compact

                CANCEL_REQUESTED["$ID"]=1
                echo "   ✅ Команду скасування відправлено"

              done < <(
                jq -r '
                  .[]
                  | select(
                      .status == "INITIALIZING"
                      or .status == "WAITING"
                      or .status == "QUEUED"
                      or .status == "BUILDING"
                      or .status == "DEPLOYING"
                    )
                  | [.id, .status, (.meta.commitHash // "")]
                  | @tsv
                ' deployments.json
              )
            fi

            if [ "$ATTEMPT" -lt 12 ]; then
              echo
              echo "⏱ Наступна перевірка через 5 секунд..."
              sleep 5
            fi
          done

          echo
          echo "=================================================="
          echo "🔎 Фінальна перевірка"
          echo "=================================================="

          railway deployment list \
            --service "$SERVICE_ID" \
            --limit 50 \
            --json > deployments-final.json

          REMAINING_OLD="$(
            jq -r --arg sha "$CURRENT_SHA" '
              [
                .[]
                | select(
                    (
                      .status == "INITIALIZING"
                      or .status == "WAITING"
                      or .status == "QUEUED"
                      or .status == "BUILDING"
                      or .status == "DEPLOYING"
                    )
                    and (.meta.commitHash // "") != ""
                    and (.meta.commitHash // "") != $sha
                  )
              ]
              | length
            ' deployments-final.json
          )"

          if [ "$REMAINING_OLD" -gt 0 ]; then
            echo "❌ Залишилися старі активні deployments: $REMAINING_OLD"
            jq -r --arg sha "$CURRENT_SHA" '
              .[]
              | select(
                  (
                    .status == "INITIALIZING"
                    or .status == "WAITING"
                    or .status == "QUEUED"
                    or .status == "BUILDING"
                    or .status == "DEPLOYING"
                  )
                  and (.meta.commitHash // "") != ""
                  and (.meta.commitHash // "") != $sha
                )
              | "  \(.status) | \(.id) | \(.meta.commitHash)"
            ' deployments-final.json
            exit 1
          fi

          echo "✅ Старих активних Railway deployments немає."
