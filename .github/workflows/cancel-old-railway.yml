name: Test Railway deployment info

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest

    steps:
      - name: Test Railway deployment info
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          echo "=== SERVICE STATUS ==="
          railway status

          echo
          echo "=== SERVICE LIST ==="
          railway service list

          echo
          echo "=== LATEST DEPLOYMENT LOGS ==="
          railway logs --latest --json
