name: Railway CLI help

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest

    steps:
      - name: Show deployment commands
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway --help
          echo
          railway deployment --help || true
          echo
          railway deploy --help
