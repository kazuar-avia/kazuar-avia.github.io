name: Cancel old Railway deployments

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cancel-old-railway
  cancel-in-progress: true

jobs:
  cancel-old:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 2
    steps:
      - name: Install tools
        run: apk add --no-cache bash jq curl

      - name: Cancel outdated Railway builds
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CURRENT_SHA: ${{ github.sha }}
          SERVICE_ID: efe286ee-8bf7-4113-8b79-4676bb804e0f
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          declare -A SENT=()

          github_get() {
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com$1"
          }

          latest_main_sha() {
            github_get "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -r '.object.sha // ""'
          }

          refresh_current_sha() {
            local latest
            latest="$(latest_main_sha)" || return 1
            if [ -z "$latest" ]; then
              echo "ERROR: cannot determine latest main SHA; refusing to cancel anything" >&2
              return 1
            fi
            if [ "$latest" != "$CURRENT_SHA" ]; then
              echo "FOLLOW MAIN: $CURRENT_SHA -> $latest"
              CURRENT_SHA="$latest"
            fi
          }

          fetch_railway_deployments() {
            local output_file="$1"
            local tmp_file="${output_file}.tmp"
            local error_file="${output_file}.error"
            local try

            for try in $(seq 1 5); do
              rm -f "$tmp_file" "$error_file"

              if railway deployment list --service "$SERVICE_ID" --limit 100 --json > "$tmp_file" 2> "$error_file" \
                && jq -e 'type == "array"' "$tmp_file" >/dev/null 2>&1; then
                mv "$tmp_file" "$output_file"
                rm -f "$error_file"
                return 0
              fi

              echo "WARN: Railway deployment list failed or returned invalid JSON (attempt $try/5)."
              if [ -s "$error_file" ]; then
                tail -n 10 "$error_file" || true
              fi

              rm -f "$tmp_file"
              if [ "$try" -lt 5 ]; then
                sleep 2
              fi
            done

            echo "ERROR: Railway deployment list failed 5 times in a row."
            return 1
          }

          is_older_than_current() {
            local candidate="$1"
            local compare_json status merge_base

            [ "$candidate" = "$CURRENT_SHA" ] && return 1

            if ! compare_json="$(github_get "/repos/$GITHUB_REPOSITORY/compare/$candidate...$CURRENT_SHA")"; then
              echo "SKIP $candidate: GitHub compare failed" >&2
              return 1
            fi

            status="$(jq -r '.status // ""' <<<"$compare_json")"
            merge_base="$(jq -r '.merge_base_commit.sha // ""' <<<"$compare_json")"

            # Cancel only when candidate is truly an ancestor of CURRENT_SHA.
            # If candidate is newer ("behind") or from another history ("diverged"),
            # it must NEVER be cancelled by this workflow.
            [ "$status" = "ahead" ] && [ "$merge_base" = "$candidate" ]
          }

          for ATTEMPT in $(seq 1 20); do
            echo "=== CHECK $ATTEMPT/20 ==="

            refresh_current_sha

            fetch_railway_deployments deployments.json

            while IFS=$'\t' read -r ID STATUS COMMIT; do
              [ -z "$ID" ] && continue

              if [ "$COMMIT" = "$CURRENT_SHA" ]; then
                echo "KEEP $STATUS $ID $COMMIT (current)"
                continue
              fi

              if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
                echo "SKIP $STATUS $ID no-commitHash"
                continue
              fi

              if [ -n "${SENT[$ID]:-}" ]; then
                continue
              fi

              if ! is_older_than_current "$COMMIT"; then
                echo "SKIP $STATUS $ID $COMMIT (not an older ancestor of $CURRENT_SHA)"
                continue
              fi

              # Follow bot commits too, but repeat the ancestry check if main
              # changed before cancellation. Never cancel the latest main SHA.
              CHECKED_SHA="$CURRENT_SHA"
              refresh_current_sha
              if [ "$CURRENT_SHA" != "$CHECKED_SHA" ] && ! is_older_than_current "$COMMIT"; then
                echo "SKIP $STATUS $ID $COMMIT (not an older ancestor of latest main $CURRENT_SHA)"
                continue
              fi

              echo "CANCEL OLD $STATUS $ID $COMMIT"
              railway api 'mutation($id: String!) { deploymentCancel(id: $id) }' --raw-var id="$ID" --compact
              SENT["$ID"]=1
            done < <(
              jq -r '
                .[]
                | select(
                    .status == "INITIALIZING"
                    or .status == "WAITING"
                    or .status == "QUEUED"
                    or .status == "BUILDING"
                    or .status == "DEPLOYING"
                  )
                | [.id, .status, (.meta.commitHash // "")]
                | @tsv
              ' deployments.json
            )

            [ "$ATTEMPT" -lt 20 ] && sleep 2
          done

          fetch_railway_deployments final.json
          refresh_current_sha
          REMAINING=0

          while IFS=$'\t' read -r ID STATUS COMMIT; do
            [ -z "$ID" ] && continue
            [ -z "$COMMIT" ] && continue
            [ "$COMMIT" = "null" ] && continue
            [ "$COMMIT" = "$CURRENT_SHA" ] && continue

            if is_older_than_current "$COMMIT"; then
              echo "REMAINS OLD $STATUS $ID $COMMIT"
              REMAINING=$((REMAINING + 1))
            fi
          done < <(
            jq -r '
              .[]
              | select(
                  .status == "INITIALIZING"
                  or .status == "WAITING"
                  or .status == "QUEUED"
                  or .status == "BUILDING"
                  or .status == "DEPLOYING"
                )
              | [.id, .status, (.meta.commitHash // "")]
              | @tsv
            ' final.json
          )

          if [ "$REMAINING" -gt 0 ]; then
            echo "ERROR: genuinely older active deployments remain: $REMAINING"
            exit 1
          fi

          echo "OK: no older Railway deployments remain"
