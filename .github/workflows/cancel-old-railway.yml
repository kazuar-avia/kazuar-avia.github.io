name: Cancel old Railway deployments

on:
  push:
    branches:
      - main

concurrency:
  group: cancel-old-railway
  cancel-in-progress: true

jobs:
  cancel-old:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest

    steps:
      - name: Cancel old Railway deployments
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          echo "Current GitHub commit: $CURRENT_SHA"

          railway deployment list \
            --service efe286ee-8bf7-4113-8b79-4676bb804e0f \
            --json > deployments.json

          echo "Deployments received"

          awk '
          /"id":/ {
              id=$0
              gsub(/.*"id": *"/,"",id)
              gsub(/".*/,"",id)
          }

          /"status":/ {
              status=$0
              gsub(/.*"status": *"/,"",status)
              gsub(/".*/,"",status)
          }

          /"commitHash":/ {
              commit=$0
              gsub(/.*"commitHash": *"/,"",commit)
              gsub(/".*/,"",commit)

              if (status == "BUILDING" || status == "QUEUED") {
                  print id "|" status "|" commit
              }
          }
          ' deployments.json > active.txt

          echo "Active deployments:"

          cat active.txt

          while IFS='|' read -r ID STATUS COMMIT; do

            if [ -z "$ID" ]; then
              continue
            fi

            echo "Found: $ID | $STATUS | $COMMIT"

            if [ "$COMMIT" = "$CURRENT_SHA" ]; then
              echo "KEEP: $ID"
              continue
            fi

            echo "CANCEL: $ID"

            railway api \
              --variables "{\"id\":\"$ID\"}" \
              'mutation($id: String!) { deploymentCancel(id: $id) }'

          done < active.txt
