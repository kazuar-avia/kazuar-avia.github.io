name: Cancel old Railway deployments

on:
  push:
    branches: [main]

concurrency:
  group: cancel-old-railway
  cancel-in-progress: true

jobs:
  cancel-old:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 2
    steps:
      - name: Install tools
        run: apk add --no-cache bash jq

      - name: Cancel outdated Railway builds
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CURRENT_SHA: ${{ github.sha }}
          SERVICE_ID: efe286ee-8bf7-4113-8b79-4676bb804e0f
        run: |
          set -Eeuo pipefail
          declare -A SENT=()

          for ATTEMPT in $(seq 1 20); do
            echo "=== CHECK $ATTEMPT/20 ==="
            railway deployment list --service "$SERVICE_ID" --limit 100 --json > deployments.json
            jq -e 'type == "array"' deployments.json >/dev/null

            while IFS=$'\t' read -r ID STATUS COMMIT; do
              [ -z "$ID" ] && continue

              if [ "$COMMIT" = "$CURRENT_SHA" ]; then
                echo "KEEP $STATUS $ID $COMMIT"
                continue
              fi

              if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
                echo "SKIP $STATUS $ID no-commitHash"
                continue
              fi

              if [ -n "${SENT[$ID]:-}" ]; then
                continue
              fi

              echo "CANCEL $STATUS $ID $COMMIT"
              railway api 'mutation($id: String!) { deploymentCancel(id: $id) }' --raw-var id="$ID" --compact
              SENT["$ID"]=1
            done < <(
              jq -r '
                .[]
                | select(
                    .status == "INITIALIZING"
                    or .status == "WAITING"
                    or .status == "QUEUED"
                    or .status == "BUILDING"
                    or .status == "DEPLOYING"
                  )
                | [.id, .status, (.meta.commitHash // "")]
                | @tsv
              ' deployments.json
            )

            [ "$ATTEMPT" -lt 20 ] && sleep 2
          done

          railway deployment list --service "$SERVICE_ID" --limit 100 --json > final.json
          REMAINING=$(jq -r --arg sha "$CURRENT_SHA" '[.[] | select((.status == "INITIALIZING" or .status == "WAITING" or .status == "QUEUED" or .status == "BUILDING" or .status == "DEPLOYING") and (.meta.commitHash // "") != "" and (.meta.commitHash // "") != $sha)] | length' final.json)

          if [ "$REMAINING" -gt 0 ]; then
            echo "ERROR: old active deployments remain: $REMAINING"
            exit 1
          fi

          echo "OK: only current build remains"
