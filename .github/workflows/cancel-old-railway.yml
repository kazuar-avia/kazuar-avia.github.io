name: Cancel old Railway deployments

on:
  push:
    branches:
      - main

concurrency:
  group: cancel-old-railway
  cancel-in-progress: true

jobs:
  cancel-old:
    runs-on: ubuntu-latest

    steps:
      - name: Cancel old Railway deployments
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          RAILWAY_TOKEN = os.environ["RAILWAY_TOKEN"]
          GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]

          PROJECT_ID = "54b4da1a-b57f-404b-9b9c-cf8af2915ea7"
          SERVICE_ID = "efe286ee-8bf7-4113-8b79-4676bb804e0f"
          ENVIRONMENT_ID = "e4a12790-f825-4d85-aec9-db5ee1ecc2b4"

          GITHUB_REPO = "kazuar-avia/kazuar-avia.github.io"

          railway_url = "https://backboard.railway.com/graphql/v2"

          railway_headers = {
              "Project-Access-Token": RAILWAY_TOKEN,
              "Content-Type": "application/json"
          }

          github_headers = {
              "Authorization": f"Bearer {GITHUB_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          github_url = f"https://api.github.com/repos/{GITHUB_REPO}/git/ref/heads/main"

          github_req = urllib.request.Request(
              github_url,
              headers=github_headers
          )

          with urllib.request.urlopen(github_req) as response:
              github_data = json.load(response)

          latest_sha = github_data["object"]["sha"]

          print("Latest GitHub commit:", latest_sha)

          query = """
          query($input: DeploymentListInput!) {
            deployments(input: $input) {
              edges {
                node {
                  id
                  status
                  createdAt
                  meta
                }
              }
            }
          }
          """

          variables = {
              "input": {
                  "projectId": PROJECT_ID,
                  "serviceId": SERVICE_ID,
                  "environmentId": ENVIRONMENT_ID
              }
          }

          body = json.dumps({
              "query": query,
              "variables": variables
          }).encode()

          req = urllib.request.Request(
              railway_url,
              data=body,
              headers=railway_headers,
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              result = json.load(response)

          if "errors" in result:
              print(result["errors"])
              raise SystemExit(1)

          deployments = [
              edge["node"]
              for edge in result["data"]["deployments"]["edges"]
          ]

          for deployment in deployments:
              status = deployment["status"]

              if status not in ("BUILDING", "QUEUED"):
                  continue

              meta = deployment.get("meta") or {}
              commit_hash = meta.get("commitHash")

              print(
                  "Found:",
                  deployment["id"],
                  status,
                  commit_hash
              )

              if not commit_hash:
                  print("SKIP: no commitHash")
                  continue

              if commit_hash == latest_sha:
                  print("KEEP:", deployment["id"])
                  continue

              mutation = """
              mutation($id: String!) {
                deploymentCancel(id: $id)
              }
              """

              cancel_body = json.dumps({
                  "query": mutation,
                  "variables": {
                      "id": deployment["id"]
                  }
              }).encode()

              cancel_req = urllib.request.Request(
                  railway_url,
                  data=cancel_body,
                  headers=railway_headers,
                  method="POST"
              )

              with urllib.request.urlopen(cancel_req) as response:
                  cancel_result = json.load(response)

              print("CANCEL:", deployment["id"], cancel_result)

          PY
