name: Test Railway API CLI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest

    steps:
      - name: Test Railway API CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway api --help
