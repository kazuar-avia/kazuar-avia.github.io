name: Update NewSky Traffic

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run script
        run: python update_newsky.py

      - name: Commit changes
        id: publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          git add newsky-live.json debug.html
          
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update NewSky traffic"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Railway cleanup after new commit
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cancel-old-railway.yml --ref main
