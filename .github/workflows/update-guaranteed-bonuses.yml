name: Update guaranteed bonuses

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - "FLIGHTS/**"
      - "COMPANY/livery-matching.json"
      - "scripts/update-top-pool.js"
      - "scripts/update-guaranteed-bonuses.js"
      - "pie-rewards.js"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-guaranteed-bonuses
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24        

      - name: Refresh hot offers
        run: node scripts/update-top-pool.js --refresh-current

      - name: Run guaranteed bonuses updater
        run: node scripts/update-guaranteed-bonuses.js

      - name: Commit updated bonus file
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- COMPANY/top-pool-current.json COMPANY/TOP-POOLS COMPANY/guaranteed-bonuses.json; then
            echo "No guaranteed bonus changes."
            exit 0
          fi

          git add COMPANY/top-pool-current.json COMPANY/TOP-POOLS COMPANY/guaranteed-bonuses.json
          git commit -m "Update guaranteed bonuses"

          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Start Railway cleanup after new commit
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cancel-old-railway.yml --ref main
