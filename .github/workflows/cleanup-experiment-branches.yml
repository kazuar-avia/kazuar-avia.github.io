name: Remove obsolete experiment branches
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-experiment-branches.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the three obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            "feature/cabinet-v2-sandbox" \
            "feature/four-currencies-20261020" \
            "feature/pilot-cabinetv2-sandbox-20261020"; do
            echo "Deleting $branch"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" --silent
          done
          echo "Three experimental branches removed."
