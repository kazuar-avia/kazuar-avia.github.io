name: Update V2 currencies (isolated)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "FLIGHTS/**"
      - "COMPANY/top-pool-current.json"
      - "COMPANY/TOP-POOLS/**"
      - "COMPANY/guaranteed-bonuses.json"
      - "scripts/update-guaranteed-bonuses-v2.js"
      - "scripts/update-pies-ledger-v2.js"
      - "pie-rewards-v2.js"
permissions:
  contents: write
concurrency:
  group: v2-currencies-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate V2 scripts
        run: |
          node --check scripts/update-guaranteed-bonuses-v2.js
          node --check scripts/update-pies-ledger-v2.js
          node --check pie-rewards-v2.js
      - name: Calculate V2 guaranteed bonuses
        run: node scripts/update-guaranteed-bonuses-v2.js
      - name: Update isolated V2 currency ledger
        run: node scripts/update-pies-ledger-v2.js
      - name: Publish only V2 data
        run: |
          if git diff --quiet -- COMPANY/guaranteed-bonuses-v2.json COMPANY/pies-ledger-v2.json; then
            echo "No V2 changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMPANY/guaranteed-bonuses-v2.json COMPANY/pies-ledger-v2.json
          git commit -m "Update isolated V2 currencies"
          git pull --rebase origin main
          git push origin HEAD:main
